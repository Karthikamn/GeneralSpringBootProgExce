name: CI for Maven Project


on:
  workflow_dispatch:

jobs:
 checkout:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout
       uses: actions/checkout@v4.2.2
     - name: Setup Java JDK
       uses: actions/setup-java@v3.14.1
       with:
          java-version: '17'
          distribution: 'microsoft'

name: CI - Maven Java

on:
 workflow_dispatch

jobs:
 ci-build:
  runs-on: ubuntu-latest
  steps:
  - name: Checkout
    uses: actions/checkout@v5.0.0
  - name: Setup Java JDK
    uses: actions/setup-java@v5.0.0
    with:  
     java-version: '17'
     distribution: 'microsoft' 
  - name: Echo Java
    run: java -version
